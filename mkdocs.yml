site_name: Learn Linux
site_url: https://gbilgi.github.io/learn-linux/
repo_url: https://github.com/gbilgi/learn-linux

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - "1. Linux Fundamentals":
      - Introduction to Linux: 01-linux-fundamentals/introduction-to-linux.md
      - File Management: 01-linux-fundamentals/file-management.md
      - "User Management & Permissions": 01-linux-fundamentals/user-management-permissions.md
      - Process Management: 01-linux-fundamentals/process-management.md
  - "2. Text Processing":
      - Text Processing: 02-text-processing/text-processing.md
      - "Advanced Text Processing & Scheduling": 02-text-processing/advanced-text-processing-scheduling.md
  - "3. Networking":
      - Introduction to Networking: 03-networking/introduction-to-networking.md
      - OSI Model: 03-networking/osi-model.md
      - Networking Devices: 03-networking/networking-devices.md
      - Networking in Linux: 03-networking/networking-in-linux.md
      - "Networking Security (DevSecOps)": 03-networking/networking-security.md
  - "4. Shell Scripting":
      - Introduction: 04-shell-scripting/shell-scripting-introduction.md
      - Fundamentals: 04-shell-scripting/shell-scripting-fundamentals.md
      - Walkthrough: 04-shell-scripting/shell-scripting-walkthrough.md
  - "5. Shell Scripting for DevOps":
      - File Management: 05-shell-scripting-devops/devops-file-management.md
      - Process Management: 05-shell-scripting-devops/devops-process-management.md
      - Filesystem Management: 05-shell-scripting-devops/devops-filesystem-management.md
      - Backup: 05-shell-scripting-devops/devops-backup.md
      - Networking: 05-shell-scripting-devops/devops-networking.md
      - AI Assisted Scripting: 05-shell-scripting-devops/ai-assisted-scripting.md
  - "6. Git":
      - Git Introduction: 06-git/git-introduction.md
      - "Git in DevOps": 06-git/git-in-devops.md
  - Cheatsheet: cheatsheet.md
  - Glossary: glossary.md
  - Resources: resources.md
